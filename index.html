<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тетрадка">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#11141B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" href="icon-192.png">

<style>
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: one narrow column, like a pocket notebook; index cards for review; one ink per course */
:root {
  --bg: #EDF0F5;
  --surface: #FFFFFF;
  --sunk: #E2E6EE;
  --ink: #1A1F2C;
  --muted: #5C6478;
  --line: #D5DAE4;
  --ml: #17786A;  --ml-soft: #D7EEE9;
  --dl: #3A55B8;  --dl-soft: #DDE3F7;
  --es: #B42F58;  --es-soft: #F6DCE4;
  --again: #B93A32;
  --hard: #A86A10;
  --good: #23784A;
  --on-grade: #FFFFFF;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Onest", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141B; --surface: #1A1E28; --sunk: #232836; --ink: #E7EAF1; --muted: #98A0B4; --line: #2C3242;
    --ml: #4CC2AE; --ml-soft: #173A36; --dl: #8EA6F7; --dl-soft: #222C4D; --es: #F27D9E; --es-soft: #45202D;
    --again: #F07167; --hard: #E7AE4C; --good: #5CCB8A; --on-grade: #11141B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141B; --surface: #1A1E28; --sunk: #232836; --ink: #E7EAF1; --muted: #98A0B4; --line: #2C3242;
  --ml: #4CC2AE; --ml-soft: #173A36; --dl: #8EA6F7; --dl-soft: #222C4D; --es: #F27D9E; --es-soft: #45202D;
  --again: #F07167; --hard: #E7AE4C; --good: #5CCB8A; --on-grade: #11141B; color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
.c-ml { --accent: var(--ml); --accent-soft: var(--ml-soft); }
.c-dl { --accent: var(--dl); --accent-soft: var(--dl-soft); }
.c-es { --accent: var(--es); --accent-soft: var(--es-soft); }
.wrap {
  max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  display: flex; flex-direction: column; gap: 20px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 2px solid var(--accent, var(--ink)); outline-offset: 2px; }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: -.01em; line-height: 1.1; }
.date { color: var(--muted); font-size: 14px; }
.streak { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.streak svg { width: 16px; height: 16px; fill: var(--hard); }

.today { background: var(--ink); color: var(--bg); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.today-row { display: flex; align-items: baseline; gap: 12px; }
.today-num { font-family: var(--display); font-weight: 700; font-size: 52px; line-height: 1; }
.today-text { font-size: 15px; opacity: .8; }
.today-split { display: flex; gap: 16px; font-family: var(--mono); font-size: 12px; opacity: .75; flex-wrap: wrap; }
.btn { border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 600; font-size: 16px; background: var(--accent, var(--ink)); color: #fff; }
.today .btn { background: var(--bg); color: var(--ink); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 140px; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--sunk); border-radius: 12px; padding: 4px; gap: 4px; }
.tab { border: 0; background: transparent; border-radius: 9px; padding: 10px 4px; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tab .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

.course-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.course-name { font-family: var(--display); font-weight: 500; font-size: 18px; }
.toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-family: var(--mono); font-size: 12px; }

.module { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.module summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 14px 16px; }
.module summary::-webkit-details-marker { display: none; }
.mod-kicker { grid-column: 1 / -1; }
.mod-title { font-weight: 600; font-size: 16px; line-height: 1.3; min-width: 0; }
.mod-meta { display: flex; align-items: center; gap: 8px; }
.chev { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; transition: transform .15s; }
.module[open] .chev { transform: rotate(180deg); }
.mod-bar { grid-column: 1 / -1; }
.row { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 13px 16px; border: 0; background: transparent; text-align: left; border-top: 1px solid var(--line); width: 100%; }
.row:active { background: var(--sunk); }
.row-n { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.row-main { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.row-title { font-weight: 500; font-size: 15px; line-height: 1.3; }
.row-sub { font-size: 12.5px; color: var(--muted); }
.row.exam { background: var(--accent-soft); }
.row.exam .row-title { font-weight: 600; }
.bar { height: 4px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.badge { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.badge.quiet { background: transparent; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 10px; }

.foot { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 13px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.linkbtn.danger { color: var(--again); }

.nav { display: flex; align-items: center; gap: 10px; }
.back { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.back svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; }
.nav-title { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h-display { font-family: var(--display); font-weight: 700; font-size: 25px; line-height: 1.2; }

.lesson { display: flex; flex-direction: column; gap: 14px; font-size: 17px; line-height: 1.6; min-width: 0; }
.lesson p { max-width: 65ch; }
.lesson b { color: var(--accent); font-weight: 600; }
.lesson code { font-family: var(--mono); font-size: .86em; background: var(--sunk); padding: 1px 5px; border-radius: 6px; overflow-wrap: anywhere; }
.lesson pre code { background: none; padding: 0; border-radius: 0; font-size: inherit; color: inherit; overflow-wrap: normal; white-space: pre; }
.lesson pre { margin: 0; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 14px 16px; overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 1.55; }

.progress { display: flex; align-items: center; gap: 10px; }
.progress .bar { flex: 1; height: 6px; }
.card {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 20px;
  min-height: 320px; padding: 24px 22px; display: flex; flex-direction: column; gap: 16px;
  box-shadow: 0 10px 30px -18px rgba(20,30,50,.35);
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--sunk) 31px 32px);
  background-position: 0 72px; cursor: pointer;
}
.card-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.boxes { display: flex; gap: 4px; flex: none; }
.boxes i { width: 8px; height: 8px; border-radius: 2px; background: var(--sunk); border: 1px solid var(--line); }
.boxes i.on { background: var(--accent); border-color: var(--accent); }
.front { font-size: 22px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.front.word { font-family: var(--display); font-weight: 500; font-size: 34px; line-height: 1.15; }
.answer { border-top: 1.5px dashed var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 18px; }
.answer .main { font-size: 20px; font-weight: 600; overflow-wrap: anywhere; }
.example { color: var(--muted); font-size: 15px; }
.example em { color: var(--ink); font-style: normal; }
.hint { margin-top: auto; text-align: center; color: var(--muted); font-size: 14px; }
.speak { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.speak svg { width: 16px; height: 16px; fill: var(--accent); }

.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grade { border: 0; border-radius: 14px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 600; color: var(--on-grade); }
.grade small { font-family: var(--mono); font-size: 11px; font-weight: 400; opacity: .85; }
.g0 { background: var(--again); } .g1 { background: var(--hard); } .g2 { background: var(--good); }

.options { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px; font-size: 16px; display: flex; gap: 12px; align-items: flex-start; }
.opt .k { font-family: var(--mono); color: var(--muted); }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.opt.wrong { border-color: var(--again); background: color-mix(in srgb, var(--again) 12%, var(--surface)); }
.why { background: var(--sunk); border-radius: 14px; padding: 14px 16px; font-size: 15px; }
.from { font-size: 13px; color: var(--muted); }

.empty { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 32px 8px; }
.big-score { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: 1; color: var(--accent); }

.words { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.word-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--line); align-items: center; font-size: 15px; }
.word-row:first-child { border-top: 0; }
.word-row b { font-weight: 600; min-width: 0; }
.word-row span { color: var(--muted); min-width: 0; }

@media (prefers-reduced-motion: no-preference) {
  .answer, .why { animation: rise .2s ease-out; }
  @keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>

<div id="app"></div>

<script>
/* Конструктор темы: T(id, title, lesson[], cards[[вопрос, ответ]], quiz[[вопрос, [варианты], индекс_верного, пояснение]]) */
const T = (id, title, lesson, cards, quiz) => ({
  id, title, lesson, cards,
  quiz: quiz.map(x => Array.isArray(x) ? { q: x[0], o: x[1], a: x[2], why: x[3] } : x)
});
/* Блок кода внутри урока */
const C = code => ({ code });

const ML = [
{ id:"basics", title:"Что такое ML",
  lesson:[
   "Машинное обучение — это когда правила не пишут вручную, а модель <b>находит закономерности в данных</b>. Вместо «если в письме есть X, это спам» мы показываем тысячи примеров, и модель сама подбирает правило.",
   "Три основных режима. <b>С учителем</b> (supervised): у каждого примера есть правильный ответ, метка. <b>Без учителя</b> (unsupervised): меток нет, модель ищет структуру, например группы похожих объектов. <b>С подкреплением</b> (RL): агент действует в среде и получает награду.",
   "Задачи с учителем бывают двух видов: <b>регрессия</b> предсказывает число (цену квартиры), <b>классификация</b> предсказывает класс (спам или не спам).",
   "<b>Признаки</b> (features) — входные данные, <b>целевая переменная</b> (target) — то, что предсказываем. Модель — это функция с параметрами, а обучение — подбор этих параметров."
  ],
  cards:[
   ["Чем ML отличается от обычного программирования?","Правила не пишутся вручную: модель находит их сама по примерам."],
   ["Что такое обучение с учителем?","Обучение на примерах, у каждого из которых есть правильный ответ (метка)."],
   ["Регрессия или классификация: в чём разница?","Регрессия предсказывает число, классификация — категорию."],
   ["Что такое признаки (features)?","Входные характеристики объекта, по которым модель делает предсказание."],
   ["Пример задачи без учителя?","Кластеризация клиентов по поведению, когда группы заранее никто не размечал."],
   ["Что значит «обучить модель»?","Подобрать её параметры так, чтобы ошибка на данных была минимальной."]
  ],
  quiz:[
   {q:"Предсказать температуру на завтра — это…", o:["Классификация","Регрессия","Кластеризация"], a:1, why:"Ответ — число на непрерывной шкале, значит это регрессия."},
   {q:"Агент играет в игру и получает очки за победы. Какой это режим?", o:["С учителем","Без учителя","С подкреплением"], a:2, why:"Обучение через награды от среды — это reinforcement learning."},
   {q:"Разбить покупателей на группы без готовых меток — это…", o:["Кластеризация","Регрессия","Классификация"], a:0, why:"Меток нет, ищем структуру: обучение без учителя, кластеризация."}
  ]},
{ id:"linreg", title:"Линейная регрессия",
  lesson:[
   "Самая простая модель: <code>ŷ = w·x + b</code>. Здесь <b>w</b> — вес (наклон прямой), <b>b</b> — смещение. Для нескольких признаков: <code>ŷ = w₁x₁ + w₂x₂ + … + b</code>.",
   "Чтобы понять, насколько модель ошибается, нужна <b>функция потерь</b>. Для регрессии стандарт — <b>MSE</b>, средний квадрат ошибки: среднее от <code>(y − ŷ)²</code>. Квадрат сильнее наказывает большие промахи.",
   "Обучение — это поиск таких w и b, при которых MSE минимальна. У линейной регрессии есть точное решение (нормальное уравнение), но на практике чаще используют градиентный спуск.",
   "<b>MAE</b> — среднее модулей ошибок. Она спокойнее относится к выбросам, чем MSE."
  ],
  cards:[
   ["Формула линейной регрессии с одним признаком?","ŷ = w·x + b"],
   ["Что такое функция потерь?","Число, которое показывает, насколько предсказания модели далеки от правильных ответов."],
   ["Как считается MSE?","Среднее значение квадратов разностей (y − ŷ)² по всем примерам."],
   ["Почему MSE чувствительна к выбросам?","Ошибки возводятся в квадрат, и один большой промах сильно увеличивает потерю."],
   ["Чем MAE отличается от MSE?","MAE берёт модуль ошибки, а не квадрат, поэтому меньше реагирует на выбросы."],
   ["Что такое b в линейной модели?","Свободный член: значение предсказания, когда все признаки равны нулю."]
  ],
  quiz:[
   {q:"Ошибки модели: 1, −1, 2. Чему равна MSE?", o:["2/3","2","4/3"], a:1, why:"(1 + 1 + 4) / 3 = 2."},
   {q:"Какой параметр задаёт наклон прямой?", o:["b","w","ŷ"], a:1, why:"w — вес, он умножается на x и задаёт наклон."},
   {q:"В данных много выбросов. Какая потеря устойчивее?", o:["MSE","MAE"], a:1, why:"MAE не возводит ошибку в квадрат, поэтому выбросы влияют меньше."}
  ]},
{ id:"gd", title:"Градиентный спуск",
  lesson:[
   "Представь, что стоишь на склоне в тумане и хочешь спуститься. Нащупываешь, куда склон уходит круче всего, и делаешь шаг туда. Это и есть <b>градиентный спуск</b>.",
   "<b>Градиент</b> — вектор частных производных функции потерь по параметрам. Он указывает направление наибольшего роста потерь, поэтому мы идём в обратную сторону: <code>w ← w − η·∇L</code>.",
   "<b>η (learning rate)</b> — размер шага. Слишком большой: модель перескакивает минимум и расходится. Слишком маленький: обучение идёт очень долго.",
   "На больших данных градиент считают не по всем примерам, а по небольшой пачке — <b>мини-батчу</b>. Один проход по всем данным называется <b>эпохой</b>. Популярные улучшения: momentum и Adam."
  ],
  cards:[
   ["Что показывает градиент?","Направление, в котором функция потерь растёт быстрее всего."],
   ["Формула шага градиентного спуска?","w ← w − η·∇L(w)"],
   ["Что будет при слишком большом learning rate?","Шаги перескакивают минимум, потери скачут или растут."],
   ["Что такое эпоха?","Один полный проход по всему обучающему набору."],
   ["Что такое мини-батч?","Небольшая порция примеров, по которой считается градиент на одном шаге."],
   ["Что такое Adam?","Оптимизатор, который подбирает свой шаг для каждого параметра и использует инерцию (momentum)."]
  ],
  quiz:[
   {q:"Потери растут с каждой итерацией. Что вероятнее всего?", o:["Learning rate слишком большой","Learning rate слишком маленький","Слишком много данных"], a:0, why:"Слишком большие шаги перелетают минимум, и ошибка начинает расти."},

const INTERVALS = [0, 1, 3, 7, 16, 35, 80];
const MAX_B = INTERVALS.length - 1;
const NEW_PER_SESSION = 8;
const dayNum = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5); };

function topicStats(sid, t) {
  const now = dayNum(); let due = 0, fresh = 0, pts = 0;
  t.cards.forEach((c, i) => {
    const p = progress[key(sid, t.id, i)];
    if (!p) fresh++; else { if (p.d <= now) due++; pts += Math.min(p.b, 4); }
  });
  return { total: t.cards.length, due, fresh, mastery: pts / (4 * t.cards.length) };
}
function groupStats(sid, topics) {
  return topics.reduce((a, t) => { const s = topicStats(sid, t); a.due += s.due; a.total += s.total; a.m += s.mastery * s.total; return a; }, { due: 0, total: 0, m: 0 });
}
const courseDue = sid => groupStats(sid, allTopics(sid)).due;

function bumpStreak() {
  const now = dayNum();
  if (meta.doneDay !== now) { meta.doneDay = now; meta.doneToday = 0; }
  meta.doneToday++;
  if (meta.last === now) return;
  meta.streak = (meta.last === now - 1) ? meta.streak + 1 : 1;
  meta.last = now;
}
const liveStreak = () => { const now = dayNum(); return (meta.last === now || meta.last === now - 1) ? meta.streak : 0; };

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const plural = (n, one, few, many) => { const m10 = n % 10, m100 = n % 100; return (m10 === 1 && m100 !== 11) ? one : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? few : many; };
const daysWord = n => n + " " + plural(n, "день", "дня", "дней");

/* ======================= ПОВТОРЕНИЕ ======================= */
function buildQueue(scope) {
  const now = dayNum(), due = [], fresh = [];
  (scope.sid ? [scope.sid] : ORDER).forEach(sid => allTopics(sid).forEach(t => {
    if (scope.tid && t.id !== scope.tid) return;
    t.cards.forEach((c, i) => {
      const k = key(sid, t.id, i), p = progress[k], item = { sid, tid: t.id, i, k, c };
      if (!p) fresh.push(item); else if (p.d <= now) due.push(item);
    });
  }));
  shuffle(due);
  return due.concat(scope.tid ? fresh.slice(0, NEW_PER_SESSION) : []);
}
function startReview(scope, back) {
  S = { screen: "review", scope, queue: buildQueue(scope), idx: 0, flipped: false, stats: [0, 0, 0], back };
  render(); window.scrollTo(0, 0);
}
function grade(g) {
  const card = S.queue[S.idx]; if (!card) return;
  const now = dayNum(), p = progress[card.k] || { b: 0, d: now };
  if (g === 0) { p.b = 0; p.d = now; S.queue.push(card); }
  else if (g === 1) { p.b = Math.max(1, p.b); p.d = now + 1; }
  else { p.b = Math.min(p.b + 1, MAX_B); p.d = now + INTERVALS[p.b]; }
  progress[card.k] = p; S.stats[g]++; bumpStreak(); saveAll();
  S.idx++; S.flipped = false; render();
}
function nextLabel(card, g) {
  if (g === 0) return "снова";
  if (g === 1) return "завтра";
  const p = progress[card.k] || { b: 0 }, d = INTERVALS[Math.min(p.b + 1, MAX_B)];
  return d === 1 ? "завтра" : "через " + daysWord(d);
}

function topicQuiz(sid, tid) {

  return { screen: "quiz", title: t.title, key: sid + "/" + tid, qs: t.quiz.map(q => ({ ...q })), qi: 0, picked: null, score: 0, back: { screen: "lesson", sid, tid } };
}
function examQuiz(sid, mi) {
  const c = COURSES[sid], m = c.modules[mi];
  const topics = m.exam.cumulative ? allTopics(sid) : m.topics;
  const pool = topics.flatMap(t => t.quiz && t.quiz.length ? t.quiz.map(q => ({ ...q, from: t.title })) : wordQuestions(t, topics));
  return { screen: "quiz", title: m.exam.name + " · " + m.title, key: sid + "/exam/" + m.id, qs: shuffle(pool).slice(0, m.exam.n), qi: 0, picked: null, score: 0, back: { screen: "home" }, exam: true };
}

/* вопросы «что значит слово» для колод без квиза */
function wordQuestions(t, topics) {
  const others = topics.filter(x => !x.lesson).flatMap(x => x.cards.map(c => c[1]));
  return t.cards.map(c => {
    const wrong = shuffle(others.filter(r => r !== c[1])).filter((r, i, a) => a.indexOf(r) === i).slice(0, 2);
    const o = shuffle([c[1], ...wrong]);
    return { q: "«" + c[0] + "» — это…", o, a: o.indexOf(c[1]), why: c[2] + " — " + c[3], from: t.title };
  });
}

      const badge = st.due ? `<span class="badge">${st.due}</span>` : (st.fresh === st.total ? `<span class="badge quiet">новое</span>` : `<span class="badge quiet">✓</span>`);
      return `<button class="row" data-act="topic" data-tid="${t.id}">
        <span class="row-n">${topicNum(tab, mi, ti)}</span>
        <span class="row-main"><span class="row-title">${esc(t.title)}</span><span class="row-sub">${sub}</span>
        <span class="bar"><i style="width:${Math.round(st.mastery * 100)}%"></i></span></span>${badge}</button>`;
    }).join("");
    let exam = "";
    if (m.exam) {
      const best = meta.quiz[tab + "/exam/" + m.id];
      const scope = m.exam.cumulative ? "весь курс" : m.topics.length + " " + plural(m.topics.length, "тема", "темы", "тем");
      exam = `<button class="row exam" data-act="exam" data-mi="${mi}">
        <span class="row-n">✎</span>
        <span class="row-main"><span class="row-title">${esc(m.exam.name)}</span><span class="row-sub">${m.exam.n} вопросов · ${scope}${best ? " · лучший " + best : ""}</span></span>
        <span class="badge quiet">тест</span></button>`;
    }
    const kicker = course.deck ? "" : `<span class="label mod-kicker">${tab === "dl" ? "Часть " + (mi + 1) : "Модуль " + (mi + 1)}</span>`;
    return `<details class="module" data-mod="${tab}/${m.id}" ${isOpen ? "open" : ""}>
      <summary>${kicker}<span class="mod-title">${esc(m.title)}</span>
        <span class="mod-meta">${gs.due ? `<span class="badge">${gs.due}</span>` : ""}${ICON.chev}</span>
        <span class="bar mod-bar"><i style="width:${Math.round(gs.m / gs.total * 100)}%"></i></span></summary>
      ${rows}${exam}</details>`;
  }).join("");

  return `<div class="wrap c-${course.color}">
    <header class="top">
      <div><div class="date">${esc(dateStr)}</div><h1 class="brand">Тетрадка</h1></div>
      <div class="streak" title="Дней подряд">${ICON.flame}<span>${daysWord(liveStreak())}</span></div>
    </header>
    <section class="today" aria-label="Сегодня">
      <div class="today-row"><span class="today-num mono">${total}</span>
        <span class="today-text">${total ? plural(total, "карточка ждёт", "карточки ждут", "карточек ждут") + " повторения" : "На сегодня всё повторено. Возьми новую тему ниже."}</span></div>
      <div class="today-split">${ORDER.map(s => `<span>${COURSES[s].tab} ${dues[s]}</span>`).join("")}<span>сегодня пройдено ${doneToday}</span></div>
      ${total ? `<button class="btn" data-act="review-all">Повторить всё</button>` : ""}
    </section>
    <div class="tabs" role="tablist">
      ${ORDER.map(s => `<button class="tab" role="tab" aria-selected="${tab === s}" data-act="tab" data-tab="${s}"><span class="dot" style="background:var(--${COURSES[s].color})"></span>${COURSES[s].tab}${dues[s] ? " · " + dues[s] : ""}</button>`).join("")}
    </div>
    <div class="course-head"><h2 class="course-name">${esc(course.name)}</h2>
      ${course.deck ? `<button class="toggle" data-act="dir">${meta.dir === "es-ru" ? "ES → RU" : "RU → ES"}</button>` : ""}</div>
    <div class="stack">${modules}</div>
    <footer class="foot">
      <span>Прогресс хранится только на этом устройстве.</span>
      <button class="linkbtn ${resetArmed ? "danger" : ""}" data-act="reset">${resetArmed ? "Нажми ещё раз, чтобы стереть весь прогресс" : "Сбросить прогресс"}</button>
    </footer>
  </div>`;
}

function viewLesson() {
  const { sid, tid } = S, c = COURSES[sid], t = findTopic(sid, tid), st = topicStats(sid, t), loc = locate(sid, tid);
  const best = meta.quiz[sid + "/" + tid];
  const n = Math.min(st.due + st.fresh, st.due + NEW_PER_SESSION);
  const body = t.lesson.map(p => typeof p === "string" ? `<p>${p}</p>` : `<pre><code>${esc(p.code)}</code></pre>`).join("");
  return `<div class="wrap c-${c.color}">
    ${nav(c.name + " · " + loc.mod.title)}
    <div><div class="label">${esc(loc.num)}</div><h2 class="h-display">${esc(t.title)}</h2></div>
    <article class="lesson">${body}</article>
    <div class="btn-row">
      <button class="btn" data-act="study" ${n ? "" : "disabled"}>${n ? "Карточки · " + n : "Карточки повторены"}</button>
      <button class="btn ghost" data-act="quiz">Квиз${best != null ? " · " + best + "/" + t.quiz.length : ""}</button>
    </div>
  </div>`;
}

function viewDeck() {
  const { sid, tid } = S, t = findTopic(sid, tid), st = topicStats(sid, t);
  const words = t.cards.map((c, i) => {
    const p = progress[key(sid, t.id, i)], b = p ? p.b : 0;
    return `<div class="word-row"><b>${esc(c[0])}</b><span>${esc(c[1])}</span>
      <span class="boxes" aria-label="уровень ${b}">${[1, 2, 3, 4].map(n => `<i class="${b >= n ? "on" : ""}"></i>`).join("")}</span></div>`;
  }).join("");
  const n = Math.min(st.due + st.fresh, st.due + NEW_PER_SESSION);
  return `<div class="wrap c-es">
    ${nav("Испанский")}
    <h2 class="h-display">${esc(t.title)}</h2>
    <button class="btn" data-act="study" ${n ? "" : "disabled"}>${n ? "Учить · " + n : "Всё повторено, приходи позже"}</button>
    <div class="words">${words}</div>
  </div>`;
}

function viewReview() {
  const q = S.queue, card = q[S.idx];
  const scopeName = S.scope.tid ? findTopic(S.scope.sid, S.scope.tid).title : "Повторение";
  const color = S.scope.sid ? COURSES[S.scope.sid].color : (card ? COURSES[card.sid].color : "ml");
  if (!card) {
    const n = S.stats[0] + S.stats[1] + S.stats[2];
    return `<div class="wrap c-${color}">${nav(scopeName)}
      <div class="empty">
        ${n ? `<div class="big-score mono">${S.stats[2]}/${n}</div><h2 class="h-display">Готово</h2>
          <p style="color:var(--muted)">Помню: ${S.stats[2]} · С трудом: ${S.stats[1]} · Не помню: ${S.stats[0]}</p>`
          : `<h2 class="h-display">Здесь пока нечего повторять</h2><p style="color:var(--muted)">Карточки вернутся, когда подойдёт их срок.</p>`}
        <button class="btn" data-act="back">Вернуться</button>
      </div></div>`;
  }
  const p = progress[card.k], b = p ? p.b : 0, c = card.c, isEs = card.sid === "es" && c.length >= 4;
  const topic = findTopic(card.sid, card.tid), reverse = isEs && meta.dir === "ru-es";
  const say = `<button class="speak" data-act="speak" data-text="${esc(c[0])}">${ICON.speak}Произнести</button>`;
  let front, back;
  if (isEs) {
    front = `<div class="front word">${esc(reverse ? c[1] : c[0])}</div>${reverse ? "" : say}`;
    back = `<div class="answer"><div class="main">${esc(reverse ? c[0] : c[1])}</div>${reverse ? say : ""}
      <div class="example"><em>${esc(c[2])}</em><br>${esc(c[3])}</div></div>`;
  } else {
    front = `<div class="front">${esc(c[0])}</div>`;
    back = `<div class="answer"><div class="main">${esc(c[1])}</div></div>`;
  }
  const label = (card.sid === "es" ? "Español · " : COURSES[card.sid].tab + " · ") + topic.title;
  return `<div class="wrap c-${COURSES[card.sid].color}">
    ${nav(scopeName)}
    <div class="progress"><div class="bar"><i style="width:${Math.round(S.idx / q.length * 100)}%"></i></div><span class="mono label">${S.idx + 1}/${q.length}</span></div>
    <div class="card" data-act="flip" tabindex="0" role="button" aria-label="Показать ответ">
      <div class="card-meta"><span class="label">${esc(label)}${p ? "" : " · новая"}</span>
        <span class="boxes" aria-label="уровень ${b}">${[1, 2, 3, 4, 5, 6].map(n => `<i class="${b >= n ? "on" : ""}"></i>`).join("")}</span></div>
      ${front}
      ${S.flipped ? back : `<div class="hint">Вспомни ответ и нажми на карточку</div>`}
    </div>
    ${S.flipped ? `<div class="grades">
      <button class="grade g0" data-act="grade" data-g="0">Не помню<small>${nextLabel(card, 0)}</small></button>
      <button class="grade g1" data-act="grade" data-g="1">С трудом<small>${nextLabel(card, 1)}</small></button>
      <button class="grade g2" data-act="grade" data-g="2">Помню<small>${nextLabel(card, 2)}</small></button>
    </div>` : `<button class="btn" data-act="flip">Показать ответ</button>`}
  </div>`;
}

function viewQuiz() {
  const qs = S.qs, color = COURSES[S.key.split("/")[0]].color;
  if (S.qi >= qs.length) {
    const pct = Math.round(S.score / qs.length * 100);
    return `<div class="wrap c-${color}">${nav(S.title)}
      <div class="empty"><div class="big-score mono">${S.score}/${qs.length}</div>
      <h2 class="h-display">${S.score === qs.length ? "Без ошибок" : pct >= 70 ? "Хороший результат" : "Есть что повторить"}</h2>
      <div class="btn-row" style="width:100%">
        <button class="btn" data-act="retry">${S.exam ? "Новый вариант" : "Ещё раз"}</button>
        <button class="btn ghost" data-act="back">${S.exam ? "К курсу" : "К уроку"}</button></div></div></div>`;
  }
  const q = qs[S.qi], picked = S.picked;
  const opts = q.o.map((o, i) => {
    let cls = "";
    if (picked != null) { if (i === q.a) cls = "right"; else if (i === picked) cls = "wrong"; }
    return `<button class="opt ${cls}" data-act="pick" data-i="${i}" ${picked != null ? "disabled" : ""}><span class="k">${"АБВГ"[i]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  return `<div class="wrap c-${color}">${nav(S.title)}
    <div class="progress"><div class="bar"><i style="width:${Math.round(S.qi / qs.length * 100)}%"></i></div><span class="mono label">${S.qi + 1}/${qs.length}</span></div>
    ${q.from ? `<div class="from">Тема: ${esc(q.from)}</div>` : ""}
    <h2 class="front">${esc(q.q)}</h2>
    <div class="options">${opts}</div>
    ${picked != null ? `<div class="why"><b>${picked === q.a ? "Верно." : "Не совсем."}</b> ${esc(q.why)}</div>
      <button class="btn" data-act="next-q">${S.qi + 1 < qs.length ? "Дальше" : "Результат"}</button>` : ""}
  </div>`;
}

/* ======================= РЕНДЕР И СОБЫТИЯ ======================= */
const app = document.getElementById("app");
function render() {
  const v = { home: viewHome, lesson: viewLesson, deck: viewDeck, review: viewReview, quiz: viewQuiz }[S.screen] || viewHome;
  app.innerHTML = v();
}
function go(s) { S = s; resetArmed = false; render(); window.scrollTo(0, 0); }

app.addEventListener("toggle", e => {
  const d = e.target;
  if (d.matches && d.matches("details[data-mod]")) { meta.open[d.dataset.mod] = d.open; saveAll(); }
}, true);

app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (a !== "reset") resetArmed = false;
  switch (a) {
    case "back": go(S.back || { screen: "home" }); break;
    case "tab": meta.tab = el.dataset.tab; saveAll(); render(); break;
    case "dir": meta.dir = meta.dir === "es-ru" ? "ru-es" : "es-ru"; saveAll(); render(); break;
    case "topic": {
      const sid = meta.tab, tid = el.dataset.tid;
      if (!findTopic(sid, tid).lesson) go({ screen: "deck", sid, tid, back: { screen: "home" } });
      else { meta.read[sid + "/" + tid] = true; saveAll(); go({ screen: "lesson", sid, tid, back: { screen: "home" } }); }
      break; }
    case "exam": go(examQuiz(meta.tab, +el.dataset.mi)); break;
    case "review-all": startReview({}, { screen: "home" }); break;
    case "study": startReview({ sid: S.sid, tid: S.tid }, { ...S }); break;
    case "quiz": go(topicQuiz(S.sid, S.tid)); break;
    case "retry": {
      const [sid, part, mid] = S.key.split("/");
      if (part === "exam") go(examQuiz(sid, COURSES[sid].modules.findIndex(m => m.id === mid)));
      else go(topicQuiz(sid, part));
      break; }
    case "flip": if (S.screen === "review" && !S.flipped) { S.flipped = true; render(); } break;
    case "speak": speak(el.dataset.text); break;
    case "grade": grade(+el.dataset.g); break;
    case "pick":
      if (S.picked != null) break;
      S.picked = +el.dataset.i;
      if (S.picked === S.qs[S.qi].a) S.score++;
      render(); break;
    case "next-q":
      S.qi++; S.picked = null;
      if (S.qi >= S.qs.length) {
        if (S.exam) {
          const prev = meta.quiz[S.key], pct = Math.round(S.score / S.qs.length * 100);
          if (!prev || parseInt(prev) < pct) meta.quiz[S.key] = pct + "%";
        } else meta.quiz[S.key] = Math.max(meta.quiz[S.key] || 0, S.score);
        saveAll();
      }
      render(); window.scrollTo(0, 0); break;
    case "reset":
      if (!resetArmed) { resetArmed = true; render(); }
      else { progress = {}; Object.assign(meta, { streak: 0, last: null, read: {}, quiz: {}, doneToday: 0, doneDay: null }); resetArmed = false; saveAll(); render(); }
      break;
  }
});

document.addEventListener("keydown", e => {
  if (S.screen !== "review" || !S.queue[S.idx]) return;
  if (!S.flipped && (e.key === " " || e.key === "Enter")) { e.preventDefault(); S.flipped = true; render(); }
  else if (S.flipped && ["1", "2", "3"].includes(e.key)) grade(+e.key - 1);
});

/* офлайн-режим, когда приложение установлено как PWA */
try {
  if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude\.ai|claudeusercontent/.test(location.hostname)) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
} catch (e) {}

render();
</script>
</body>
</html>
